<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>TadımRotası Reel 02 — Elo vs Sahte Puan 15s</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #F4F1EA;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #111827;
  }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #F4F1EA;
  }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: #E05A2B; }
  .eyebrow {
    position: absolute; top: 96px; left: 72px;
    font-family: Consolas, monospace; font-size: 24px; font-weight: 700;
    letter-spacing: 0.14em; color: #0B4A4F;
  }
  .hook-wrap { position: absolute; top: 152px; left: 72px; right: 72px; }
  .hook-title { font-size: 68px; font-weight: 800; line-height: 1.08; color: #111827; }
  .strike { text-decoration: line-through; color: #94A3B8; }
  .hook-accent { color: #0B4A4F; }

  .battle {
    position: absolute; top: 470px; left: 72px; right: 72px;
    display: flex; gap: 28px; align-items: stretch;
  }
  .b-card {
    flex: 1; background: #FFFFFF; border-radius: 28px; padding: 32px;
    border: 3px solid #CBD5E1; box-shadow: 0 20px 44px rgba(17,24,39,0.08);
  }
  .b-card.win { border-color: #0B4A4F; background: #F0FDF9; }
  .b-label { font-family: Consolas, monospace; font-size: 20px; font-weight: 700; color: #475569; }
  .b-name { font-size: 36px; font-weight: 800; margin-top: 12px; color: #111827; }
  .b-score {
    display: inline-block; margin-top: 20px; padding: 10px 22px; border-radius: 999px;
    background: #0B4A4F; color: #fff; font-size: 26px; font-weight: 800;
  }
  .b-card:not(.win) .b-score { background: #E2E8F0; color: #334155; }

  .map-box {
    position: absolute; left: 72px; right: 72px; top: 820px; height: 780px;
    border-radius: 34px; overflow: hidden; border: 4px solid #0B4A4F;
    box-shadow: 0 30px 70px rgba(17,24,39,0.18);
  }
  .map-box img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .mode-badge {
    position: absolute; left: 28px; top: 28px;
    background: rgba(17,24,39,0.88); color: #fff;
    padding: 14px 26px; border-radius: 999px; font-size: 24px; font-weight: 700;
  }

  .cta-banner {
    position: absolute; left: 72px; right: 72px; bottom: 84px;
    background: #111827; color: #FFFFFF; border-radius: 32px;
    padding: 34px 40px; display: flex; justify-content: space-between; align-items: center;
  }
  .cta-banner h2 { font-size: 38px; font-weight: 800; }
  .cta-banner p { font-size: 24px; color: #CBD5E1; margin-top: 6px; }
  .cta-pill {
    background: #E05A2B; color: #fff; font-size: 26px; font-weight: 800;
    padding: 18px 28px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="stage" data-composition-id="reel02" data-width="1080" data-height="1920">
    <div class="top-bar"></div>
    <div id="eyebrow" class="eyebrow">İKİLİ ELO SIRALAMA · REKLAMSIZ</div>
    <div id="hook" class="hook-wrap">
      <div class="hook-title">Haritada her yer <span class="strike">★ 4.8</span>. Peki <span class="hook-accent">gerçekte</span> hangisi iyi?</div>
    </div>

    <div id="battle" class="battle">
      <div id="cardA" class="b-card win">
        <div class="b-label">SEÇENEK A · KAZANAN</div>
        <div class="b-name">İmam Çağdaş</div>
        <div class="b-score">Elo 9.5 ★</div>
      </div>
      <div id="cardB" class="b-card">
        <div class="b-label">SEÇENEK B</div>
        <div class="b-name">Turistik Kebap</div>
        <div class="b-score">Elo 7.8</div>
      </div>
    </div>

    <div id="mapBox" class="map-box">
      <img id="dayMap" src="../../../.gemini/antigravity/brain/5872deee-1d35-432b-ba9c-a8f6539c23c1/scratch/tr_shots/desktop-tadim3d-istanbul.png" alt="Tadım 3D" />
      <img id="nightMap" src="../../../.gemini/antigravity/brain/5872deee-1d35-432b-ba9c-a8f6539c23c1/scratch/tr_shots/desktop-gece3d-istanbul.png" alt="Gece 3D" style="opacity:0" />
      <div id="modeBadge" class="mode-badge">Tadım 3D · Gündüz</div>
    </div>

    <div id="cta" class="cta-banner">
      <div>
        <h2>10 Saniyede Top 10 Listeni Kur</h2>
        <p>81 il · 4.350+ mekân · Story kartını paylaş</p>
      </div>
      <div class="cta-pill">TadımRotası</div>
    </div>
  </div>

  <script>
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
    const prog = (t, s, e) => easeOut((t - s) / (e - s));

    window.__duration = 15.0;
    window.__timelines = {
      reel02: {
        seek(t) {
          const hook = document.getElementById('hook');
          const battle = document.getElementById('battle');
          const cardA = document.getElementById('cardA');
          const mapBox = document.getElementById('mapBox');
          const nightMap = document.getElementById('nightMap');
          const modeBadge = document.getElementById('modeBadge');
          const cta = document.getElementById('cta');

          const pHook = prog(t, 0.0, 0.8);
          hook.style.opacity = pHook;
          hook.style.transform = `translateY(${(1 - pHook) * 32}px)`;

          const pBat = prog(t, 2.5, 3.6);
          battle.style.opacity = pBat;
          battle.style.transform = `translateY(${(1 - pBat) * 50}px)`;
          const winPop = t > 4.6 ? 1 + 0.03 * easeOut((t - 4.6) / 0.6) : 1;
          cardA.style.transform = `scale(${winPop})`;

          const pMap = prog(t, 6.2, 7.5);
          mapBox.style.opacity = pMap;
          mapBox.style.transform = `scale(${0.95 + 0.05 * pMap})`;

          const pNight = prog(t, 9.2, 10.6);
          nightMap.style.opacity = pNight;
          modeBadge.textContent = pNight > 0.5 ? 'Gece 3D · Karanlık Mod' : 'Tadım 3D · Gündüz';

          const pCta = prog(t, 11.6, 12.6);
          cta.style.opacity = pCta;
          cta.style.transform = `translateY(${(1 - pCta) * 44}px)`;
        }
      }
    };
    window.__timelines.reel02.seek(0);
  </script>
</body>
</html>
