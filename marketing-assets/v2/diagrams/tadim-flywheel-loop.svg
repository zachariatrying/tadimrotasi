<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc" id="tadim-flywheel-loop-root">
      <title id="loop-title">TadımRotası Organik Büyüme Döngüsü</title>
      <desc id="loop-desc">Keşfet, Kaydet, İkili Sırala, Paylaş, Arkadaş Ekle ve Öneri Al adımlarının kişisel lezzet grafiğini beslediği saat yönü döngü.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #tadim-flywheel-loop-root { --paper: #f4f1ea; --ink: #111827; --muted: #475569; --soft: #52606d;
      --accent: #0b4a4f; --accent-tint: rgba(11,74,79,0.08); --link: #0369a1;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #tadim-flywheel-loop-root { color: var(--ink); font-family: var(--sans); }
      #tadim-flywheel-loop-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #tadim-flywheel-loop-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #tadim-flywheel-loop-root .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #tadim-flywheel-loop-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #tadim-flywheel-loop-root .hub { fill: var(--ink); }
      #tadim-flywheel-loop-root .node-name { fill: var(--ink); font: 600 12px var(--sans); text-anchor: middle; }
      #tadim-flywheel-loop-root .focal-name { fill: var(--accent); }
      #tadim-flywheel-loop-root .sublabel { fill: var(--soft); font: 400 8px var(--mono); text-anchor: middle; }
      #tadim-flywheel-loop-root .hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
      #tadim-flywheel-loop-root .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 8px var(--mono); text-anchor: middle; }
      #tadim-flywheel-loop-root .arrow-label { fill: var(--soft); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }</style>
        <pattern id="tadim-flywheel-loop-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#111827" fill-opacity="0.10"/></pattern>
        <marker id="tadim-flywheel-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
        <marker id="tadim-flywheel-loop-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52606d"/></marker>
      </defs>
      <rect width="1040" height="680" fill="#f4f1ea"/>
      <rect width="1040" height="680" fill="url(#tadim-flywheel-loop-dots)" opacity="0.55"/>

      <!-- Solid clockwise ring -->
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#tadim-flywheel-loop-arrow)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#tadim-flywheel-loop-arrow)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#tadim-flywheel-loop-arrow)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#tadim-flywheel-loop-arrow)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#tadim-flywheel-loop-arrow)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#tadim-flywheel-loop-arrow)"/>

      <!-- Dashed write-backs -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#tadim-flywheel-loop-arrow-soft)"/>
      <path class="spoke" d="M672 252 L616 284" marker-end="url(#tadim-flywheel-loop-arrow-soft)"/>
      <path class="spoke" d="M672 428 L616 396" marker-end="url(#tadim-flywheel-loop-arrow-soft)"/>
      <path class="spoke" d="M520 548 V400" marker-end="url(#tadim-flywheel-loop-arrow-soft)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#tadim-flywheel-loop-arrow-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#tadim-flywheel-loop-arrow-soft)"/>

      <rect x="532" y="200" width="56" height="16" rx="4" fill="#f4f1ea"/>
      <text x="560" y="212" class="arrow-label">SİNYALLER</text>
      <rect x="460" y="464" width="52" height="16" rx="4" fill="#f4f1ea"/>
      <text x="486" y="476" class="arrow-label">SKORLAR</text>

      <!-- Stations -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <text x="520" y="96" class="node-name">Keşfet</text><text x="520" y="116" class="sublabel">81 ilde 3D harita</text>

      <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name">Kaydet</text><text x="728" y="236" class="sublabel">Reels &amp; Yakınımda</text>

      <rect class="station focal" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name focal-name">İkili Sırala</text><text x="728" y="476" class="sublabel">A mı B mi? Elo</text>

      <rect class="station" x="440" y="548" width="160" height="64" rx="6"/>
      <text x="520" y="576" class="node-name">Paylaş</text><text x="520" y="596" class="sublabel">Story Top 10 kartı</text>

      <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
      <text x="312" y="456" class="node-name">Arkadaş Ekle</text><text x="312" y="476" class="sublabel">% damak uyumu</text>

      <rect class="station" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name">Öneri Al</text><text x="312" y="236" class="sublabel">sana özel seçki</text>

      <!-- Central Hub -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="336" class="hub-name">Lezzet Grafiği</text>
      <text x="520" y="360" class="hub-sub">kişisel + sosyal hafıza</text>
    </svg>
