<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>TadımRotası Reel 02 — Elo vs Sahte Puan 15s</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #F4F1EA;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #111827;
  }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(circle at 18% 12%, rgba(224,90,43,0.12), transparent 50%), #F4F1EA;
  }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: #E05A2B; }
  .eyebrow {
    position: absolute; top: 88px; left: 72px;
    font-family: Consolas, monospace; font-size: 24px; font-weight: 700;
    letter-spacing: 0.14em; color: #0B4A4F;
  }
  .hook-wrap { position: absolute; top: 144px; left: 72px; right: 72px; }
  .hook-title { font-size: 66px; font-weight: 800; line-height: 1.08; color: #111827; }
  .strike-wrap { position: relative; display: inline-block; color: #64748B; }
  .strike-bar {
    position: absolute; left: -4px; right: -4px; top: 52%; height: 9px;
    background: #E05A2B; border-radius: 6px; transform-origin: left center;
  }
  .hook-accent { color: #0B4A4F; }

  .battle {
    position: absolute; top: 450px; left: 72px; right: 72px;
    display: flex; gap: 26px; align-items: stretch;
  }
  .b-card {
    flex: 1; background: #FFFFFF; border-radius: 28px; padding: 30px;
    border: 3px solid #CBD5E1; box-shadow: 0 20px 44px rgba(17,24,39,0.08);
    position: relative;
  }
  .b-card.win { border-color: #0B4A4F; background: #F0FDF9; }
  .b-label { font-family: Consolas, monospace; font-size: 20px; font-weight: 700; color: #475569; }
  .b-name { font-size: 36px; font-weight: 800; margin-top: 12px; color: #111827; }
  .b-score {
    display: inline-block; margin-top: 20px; padding: 10px 22px; border-radius: 999px;
    background: #0B4A4F; color: #fff; font-size: 26px; font-weight: 800;
  }
  .b-card:not(.win) .b-score { background: #E2E8F0; color: #334155; }
  .tap-dot {
    position: absolute; right: 26px; bottom: 26px; width: 44px; height: 44px;
    border-radius: 999px; background: rgba(224,90,43,0.22); border: 3px solid #E05A2B;
    opacity: 0;
  }

  .map-box {
    position: absolute; left: 72px; right: 72px; top: 800px; height: 800px;
    border-radius: 34px; overflow: hidden; border: 5px solid #0B4A4F;
    box-shadow: 0 30px 70px rgba(17,24,39,0.2);
    background: #0B4A4F;
  }
  .map-box img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform-origin: center center;
  }
  .mode-badge {
    position: absolute; left: 26px; top: 26px;
    background: rgba(17,24,39,0.9); color: #fff;
    padding: 14px 26px; border-radius: 999px; font-size: 24px; font-weight: 700;
  }

  .cta-banner {
    position: absolute; left: 72px; right: 72px; bottom: 78px;
    background: #111827; color: #FFFFFF; border-radius: 32px;
    padding: 28px 34px; display: flex; justify-content: space-between; align-items: center; gap: 20px;
  }
  .cta-brand { display: flex; align-items: center; gap: 18px; }
  .cta-brand img { width: 68px; height: 68px; border-radius: 16px; object-fit: cover; }
  .cta-banner h2 { font-size: 35px; font-weight: 800; }
  .cta-banner p { font-size: 22px; color: #CBD5E1; margin-top: 4px; }
  .cta-pill {
    background: #E05A2B; color: #fff; font-size: 25px; font-weight: 800;
    padding: 18px 28px; border-radius: 999px; white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="stage" data-composition-id="reel02" data-width="1080" data-height="1920">
    <div class="top-bar"></div>
    <div id="eyebrow" class="eyebrow">İKİLİ ELO SIRALAMA · REKLAMSIZ</div>
    <div id="hook" class="hook-wrap">
      <div class="hook-title">
        Haritada her yer <span class="strike-wrap">★ 4.8<span id="strikeBar" class="strike-bar"></span></span>. Peki <span class="hook-accent">gerçekte</span> hangisi iyi?
      </div>
    </div>

    <div id="battle" class="battle">
      <div id="cardA" class="b-card win">
        <div class="b-label">SEÇENEK A · KAZANAN</div>
        <div class="b-name">İmam Çağdaş</div>
        <div id="eloA" class="b-score">Elo 8.8 ★</div>
        <div id="tapDot" class="tap-dot"></div>
      </div>
      <div id="cardB" class="b-card">
        <div class="b-label">SEÇENEK B</div>
        <div class="b-name">Turistik Kebap</div>
        <div class="b-score">Elo 7.8</div>
      </div>
    </div>

    <div id="mapBox" class="map-box">
      <img id="dayMap" src="./assets/desktop-tadim3d-istanbul.png" alt="Tadım 3D" />
      <img id="nightMap" src="./assets/desktop-gece3d-istanbul.png" alt="Gece 3D" style="opacity:0" />
      <div id="modeBadge" class="mode-badge">☀️ Tadım 3D · Gündüz Haritası</div>
    </div>

    <div id="cta" class="cta-banner">
      <div class="cta-brand">
        <img src="./assets/tadimrotasi_icon.png" alt="TadımRotası" />
        <div>
          <h2>10 Saniyede Top 10 Listeni Kur</h2>
          <p>81 il · 4.535+ mekân · Story kartını paylaş</p>
        </div>
      </div>
      <div class="cta-pill">TadımRotası</div>
    </div>
  </div>

  <script>
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
    const prog = (t, s, e) => easeOut((t - s) / (e - s));

    window.__duration = 15.0;
    window.__renderMode = window.__renderMode || false;
    window.__timelines = {
      reel02: {
        seek(t) {
          const hook = document.getElementById('hook');
          const strikeBar = document.getElementById('strikeBar');
          const battle = document.getElementById('battle');
          const cardA = document.getElementById('cardA');
          const cardB = document.getElementById('cardB');
          const eloA = document.getElementById('eloA');
          const tapDot = document.getElementById('tapDot');
          const mapBox = document.getElementById('mapBox');
          const dayMap = document.getElementById('dayMap');
          const nightMap = document.getElementById('nightMap');
          const modeBadge = document.getElementById('modeBadge');
          const cta = document.getElementById('cta');

          const pHook = prog(t, 0.0, 0.7);
          hook.style.opacity = pHook;
          hook.style.transform = `translateY(${(1 - pHook) * 32}px)`;
          strikeBar.style.transform = `scaleX(${prog(t, 1.0, 1.7)})`;

          const pBat = prog(t, 2.0, 3.0);
          battle.style.opacity = pBat;
          battle.style.transform = `translateY(${(1 - pBat) * 44}px)`;

          // Tap animation & Elo score increment
          const pTap = clamp((t - 4.4) / 0.8);
          tapDot.style.opacity = t > 4.4 && t < 5.3 ? Math.sin(pTap * Math.PI) : 0;
          tapDot.style.transform = `scale(${0.7 + 0.9 * pTap})`;

          const eloVal = 8.8 + 0.7 * prog(t, 4.7, 5.8);
          eloA.textContent = `Elo ${eloVal.toFixed(1)} ★`;
          const winPop = t > 4.7 ? 1 + 0.03 * easeOut((t - 4.7) / 0.5) : 1;
          cardA.style.transform = `scale(${winPop})`;
          cardB.style.opacity = t > 4.7 ? 0.65 : 1;

          const pMap = prog(t, 6.0, 7.2);
          mapBox.style.opacity = pMap;
          mapBox.style.transform = `scale(${0.94 + 0.06 * pMap})`;

          const panX = -26 * Math.sin(clamp((t - 6.0) / 9.0) * Math.PI);
          const mapZoom = 1.08 + 0.06 * clamp((t - 6.0) / 9.0);
          dayMap.style.transform = `scale(${mapZoom}) translateX(${panX}px)`;
          nightMap.style.transform = `scale(${mapZoom}) translateX(${panX}px)`;

          const pNight = prog(t, 9.8, 11.0);
          nightMap.style.opacity = pNight;
          modeBadge.textContent = pNight > 0.5 ? '🌙 Gece 3D · Meyhane & Ocakbaşı Modu' : '☀️ Tadım 3D · Gündüz Haritası';

          const pCta = prog(t, 11.8, 12.8);
          cta.style.opacity = pCta;
          cta.style.transform = `translateY(${(1 - pCta) * 44}px)`;
        }
      }
    };
    window.__timelines.reel02.seek(0);

    if (!navigator.webdriver && !window.__renderMode) {
      const t0 = performance.now();
      const loop = (now) => {
        if (!window.__renderMode) {
          window.__timelines.reel02.seek(((now - t0) / 1000) % window.__duration);
          requestAnimationFrame(loop);
        }
      };
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
